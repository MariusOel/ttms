[env:esp32-c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
extra_scripts = pre:scripts/prune_libs.py

lib_deps = 
    lovyan03/LovyanGFX @ ^1.1.12
    lvgl/lvgl @ ^8.3.11

build_flags = 
    -D LV_CONF_INCLUDE_SIMPLE
    -I src
    -D LGFX_USE_V1
    -D U8G2_WITHOUT_U8X8
    -D LGFX_ENABLE_FONT_CJK=0
    -D LGFX_ENABLE_FONT_JAPANESE=0
    -D LGFX_ENABLE_FONT_CHINESE=0
    -D LGFX_ENABLE_FONT_KOREAN=0
    -Wl,--gc-sections
